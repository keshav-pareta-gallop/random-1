name: postgresql_physical_schema
connections:
  source: { engine: mssql }
  target: { engine: postgres }

source_setup:
  ddl:
    - /workspace/source/random-2/sql/schema.sql

migration:
  steps:
    - { kind: ddl, sql: sql/schema.sql }
    - kind: transform
      sql_text: "INSERT INTO customers (email, full_name) VALUES ('test@example.com', 'Test User')"

suites:
  # ──────────────────────────────────────────────────────────────────────────
  # Suite 1: Target-only schema conformance (AC1, AC3, AC4, AC5)
  # Proves: DDL applies cleanly, object types correct, constraints present,
  # FK type consistency, all columns/types/defaults/nullability verified.
  # NO source_database — this is a "schema applies" criterion, target-only.
  # ──────────────────────────────────────────────────────────────────────────
  - pattern: schema_conformance
    id: target-schema-build
    target_dataset: "${BUILD_DATASET}"
    expect_table_count: 2
    tables:
      # ── customers ──
      - table: customers
        expect_object_type: TABLE
        primary_key: [customer_id]
        unique_keys: [[email]]
        expect_exact_indexes: true
        expect_no_foreign_keys: true
        columns:
          - { name: customer_id, type: INTEGER, nullable: false, default: null }
          - { name: email, type: VARCHAR, nullable: false, default: null }
          - { name: full_name, type: VARCHAR, nullable: false, default: null }
          - { name: created_at, type: TIMESTAMP, nullable: false, default: "now()" }
      # ── orders ──
      - table: orders
        expect_object_type: TABLE
        primary_key: [order_id]
        expect_exact_indexes: true
        foreign_keys:
          - columns: [customer_id]
            references: { table: customers, columns: [customer_id] }
        expect_exact_foreign_keys: true
        check_constraints:
          - "status = ANY(ARRAY['placed', 'shipped', 'delivered'])"
        columns:
          - { name: order_id, type: INTEGER, nullable: false, default: null }
          - { name: customer_id, type: INTEGER, nullable: false, default: null }
          - { name: total, type: NUMERIC, nullable: false, scale: 2, default: null }
          - { name: status, type: VARCHAR, nullable: false, default: "'placed'" }
          - { name: placed_at, type: TIMESTAMP, nullable: false, default: "now()" }

  # ──────────────────────────────────────────────────────────────────────────
  # Suite 2: Source cross-check — legacy→target type mapping (AC2)
  # Reads the MSSQL source (stood up from source_setup DDL) and cross-checks
  # every column's source type against the declared target type.
  # 9 columns across 2 tables, all type mappings verified live.
  # ──────────────────────────────────────────────────────────────────────────
  - pattern: schema_conformance
    id: type-mapping-cross-check
    target_dataset: "${BUILD_DATASET}"
    source_database: dbo
    tables:
      - table: customers
        source_table: Customers
        columns:
          - { name: customer_id, type: INTEGER, source_name: CustomerId, source_type: INT64 }
          - { name: email, type: VARCHAR, source_name: Email, source_type: STRING }
          - { name: full_name, type: VARCHAR, source_name: FullName, source_type: STRING }
          - { name: created_at, type: TIMESTAMP, source_name: CreatedAt, source_type: TIMESTAMP }
      - table: orders
        source_table: Orders
        columns:
          - { name: order_id, type: INTEGER, source_name: OrderId, source_type: INT64 }
          - { name: customer_id, type: INTEGER, source_name: CustomerId, source_type: INT64 }
          - { name: total, type: NUMERIC, scale: 2, source_name: Total, source_type: NUMERIC }
          - { name: status, type: VARCHAR, source_name: Status, source_type: STRING }
          - { name: placed_at, type: TIMESTAMP, source_name: PlacedAt, source_type: TIMESTAMP }

  # ──────────────────────────────────────────────────────────────────────────
  # Suite 3: Queryability smoke test (AC6)
  # Proves all 3 objects are queryable with 0 errors, including the view.
  # The migration transform step inserts a test row before these queries run,
  # so the view exercises COALESCE + LEFT JOIN on real data.
  # ──────────────────────────────────────────────────────────────────────────
  - pattern: query_performance
    id: queryability-smoke
    target_dataset: "${BUILD_DATASET}"
    queries:
      - id: select-customers
        mode: measure
        sql: "SELECT * FROM ${BUILD_DATASET}.customers LIMIT 1"
      - id: select-orders
        mode: measure
        sql: "SELECT * FROM ${BUILD_DATASET}.orders LIMIT 0"
      - id: select-view
        mode: measure
        sql: "SELECT * FROM ${BUILD_DATASET}.customer_lifetime_value LIMIT 1"
      - id: cross-object-view-query
        mode: measure
        sql: "SELECT lifetime_value, order_count FROM ${BUILD_DATASET}.customer_lifetime_value"
      - id: view-object-type-check
        mode: measure
        sql: "SELECT table_name FROM information_schema.views WHERE table_schema = '${BUILD_DATASET}' AND table_name = 'customer_lifetime_value'"
      - id: tables-object-type-check
        mode: measure
        sql: "SELECT table_name, table_type FROM information_schema.tables WHERE table_schema = '${BUILD_DATASET}' AND table_type = 'BASE TABLE' AND table_name IN ('customers', 'orders')"
